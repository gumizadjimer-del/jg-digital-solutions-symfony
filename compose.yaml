services:

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: jg_symfony_php
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - database
    networks:
      - jg_symfony_network
    command: php -S 0.0.0.0:8000 -t public

  database:
    image: mysql:8.4
    container_name: jg_symfony_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jg_symfony}
      MYSQL_USER: ${MYSQL_USER:-symfony}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    ports:
      - "3306:3306"
    volumes:
      - database_data:/var/lib/mysql
    networks:
      - jg_symfony_network

  jg_symfony_phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: jg_symfony_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: database
    ports:
      - "8082:80"
    networks:
      - jg_symfony_network

volumes:
  database_data:

networks:
  jg_symfony_network:
    driver: bridge